[package]
name = "myna-verifier"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "myna-verifier"

# tlsn is not published on crates.io; pin the git tag. The browser prover uses the
# npm package `tlsn-wasm@0.1.0-alpha.15`, built from this same tag. Both sides MUST
# be bumped together (the MPC-TLS protocol is not compatible across alpha releases).
[dependencies]
criteria = { path = "../crates/criteria" }
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
# Only used by the native test prover (same code path as the WASM prover).
tlsn-sdk-core = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
async-tungstenite = { version = "0.29", features = ["tokio-runtime"] }
ws_stream_tungstenite = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
dotenvy = "0.15"
humantime = "2"

[profile.release]
debug = false

# The MPC code is unusably slow without optimizations; optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 3
