# Fly.io app: see deploy/fly/ and deploy/README.md. Secrets (World ID, RP key,
# verifier secret) are set with `fly secrets import`, never in this file.
app = "mynachat"
primary_region = "nrt"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  # World ID actions are one-time per person; keep production's separate from local dev ("dev-").
  WLD_ACTION_PREFIX = "prod-"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine holds the SQLite volume and live MPC sessions: keep it running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/search"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
